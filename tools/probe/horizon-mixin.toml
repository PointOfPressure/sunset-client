# A test probe for tools/verify.py, staged next to Sunset on the test machine only (never packed or shipped):
# once a frame, just before the frame is drawn, it appends what the frame is drawn from to the file named by
# the SUNSET_PROBE environment variable; and each move packet, hit and end of a client tick as it goes on the wire.
[mod]
id = "probe"
version = "0.1.0"
priority = 50

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "probe"
file = "crates/horizon-client/src/game.rs"
name = "sunset_probe"
source = "probe.rs"

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::pad::Game<'_>::pad_look"
helper = "hook.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[[module]]
id = "probe_wire"
file = "crates/horizon-protocol/src/connection.rs"
name = "probe_wire"
source = "wire.rs"
visibility = "pub"

[[module]]
id = "probe_antibot"
file = "crates/horizon-client/src/game/remote.rs"
name = "probe_antibot"
source = "antibot.rs"

[[injection]]
id = "antibot_tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_handle_input"
helper = "antibot_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
]

[[injection]]
id = "antibot_replace_on_turn"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_send_state"
helper = "antibot_turn_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
]

[[injection]]
id = "antibot_evade_pending"
kind = "RETURN"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "antibot_after_tick.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
]

[[injection]]
id = "wire"
kind = "HEAD"
target = "horizon_protocol::connection::ConnWriter::send"
helper = "wire_hook.rs"
bindings = [
  { name = "body", ty = "&[u8]", value = "body" },
]
