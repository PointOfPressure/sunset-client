id = "sunset"
name = "Sunset"
version = "2.1.0"
description = "A utility client for Horizon: modules, a click GUI, HUD and world overlays."
authors = ["PointOfPressure", "Sunset contributors"]
api = "0.2"
side = "client"
capabilities = ["registries"]

# Sunset changes the game's own functions, so it is made for exactly this game build.
