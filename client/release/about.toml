# cargo-about 0.9.3 config for client/release/third-party.sh (THIRD-PARTY-LICENSES of every binary Sunset ships).
# "accepted" is only the order cargo-about picks a licence of a dual-licensed crate in, not a policy: anything outside
# the permissive group is flagged by third_party.py, and anything not listed here fails the run so it gets a look.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
    "MIT-0", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "Unlicense", "bzip2-1.0.6", "NCSA",
    "CDLA-Permissive-2.0", "OFL-1.1", "MPL-2.0", "LGPL-2.1-or-later", "LGPL-3.0-or-later", "LGPL-3.0-only",
    "GPL-3.0-or-later", "AGPL-3.0-or-later", "Pixar",
]
# Linux and Windows builds both ship: keep the platform crates of both.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
