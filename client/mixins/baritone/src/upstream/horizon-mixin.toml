# BlockChangeEvent: every block the server (or the client's own prediction) sets. The elytra flight keeps its picture of the
# solid blocks up to date from them.
# ClientboundPlayerPositionPacket, for ElytraBehavior.onReceivePacket.
[[injection]]
id = "set_back"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_teleport"
helper = "hooks/set_back.rs"
bindings = []

[[injection]]
id = "block_change"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::set_block"
helper = "hooks/block_change.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "i32", value = "state" },
]

# BlockInteractEvent (USE): the player right-clicks. A bed under the crosshair is remembered as a waypoint.
[[injection]]
id = "block_interact"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_use_item_on"
helper = "hooks/block_interact.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# The click screen of `#click` is the playing screen with the mouse let go. The game asks this function about every press on any
# screen, and a release reaches the native key hook.
[[injection]]
id = "click_press"
kind = "HEAD"
target = "horizon_client::game::tweaks::Game<'_>::sort_mouse_press"
helper = "hooks/click_press.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# The game asks this function about every key before it acts on it, the Escape that opens the pause menu too.
[[injection]]
id = "click_escape"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::tweaks::Game<'_>::sort_key_press"
helper = "hooks/click_escape.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
]

[[injection]]
id = "click_key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "hooks/click_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# Tab completion for a `#line`: the chat screen asks Baritone for the candidates when the text is not a
# `/command`, through a function the game registers in the small bridge module.
[[module]]
id = "mod_suggest_bridge"
file = "crates/horizon-client-render/src/chat.rs"
name = "baritone_suggest"
visibility = "pub"
source = "src/game/suggest_bridge.rs"

[[module]]
id = "mod_tab"
file = "crates/horizon-client/src/game.rs"
name = "baritone_tab"
source = "src/command/tab.rs"

[[injection]]
id = "suggest"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::chat::ChatScreen::update_command_info"
helper = "hooks/suggest_hook.rs"
bindings = [
  { name = "screen", ty = "&mut ChatScreen", value = "&mut *self" },
  { name = "m", ty = "&Measure", value = "m" },
]
