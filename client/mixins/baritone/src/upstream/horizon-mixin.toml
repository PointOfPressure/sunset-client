# Baritone's page in Options > Mods is a screen of its own, in the style of the Punchy settings screen: what it shows, where
# everything stands and what a click does (plain Rust, tested in the lib crate), and the drawing of it. Six hooks in the game's
# options wrappers hand it the drawing, the mouse, a drag, the wheel, a key and typed text while the page open is Baritone's.
[[module]]
