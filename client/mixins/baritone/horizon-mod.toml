[[native.mixin]]
id = "register"
target = "horizon_client::game::native_hooks::client_tick_post::Game<'_>::native_client_tick_post"
kind = "HEAD"
helper = "src/mixins/register_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "full_unload"
target = "horizon_client::game::remote::level_state::Game<'_>::forget_remote_columns_body"
kind = "HEAD"
helper = "src/mixins/unload.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "gone", ty = "&horizon_client::fast_hash::FxHashSet<(i32, i32)>", value = "&*gone" },
]

[[native.mixin]]
id = "full_chat"
target = "horizon_client::game::chat::Game<'_>::handle_chat_input"
kind = "HEAD"
cancellable = true
helper = "src/upstream/hooks/chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]

[[native.mixin]]
id = "full_tick"
target = "horizon_client::game::native_hooks::client_tick_post::Game<'_>::native_client_tick_post"
kind = "HEAD"
helper = "src/upstream/hooks/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "full_command"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_command"
kind = "HEAD"
helper = "src/upstream/hooks/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

