# Sunset's Baritone companion as an .hmod mod of its own beside Sunset: it registers horizon-baritone's runtime with
# Sunset's Baritone module (client/sunset/src/game/api.rs register_baritone) and loads the separately built, replaceable
# LGPL engine library (client/baritone-engine). horizon-baritone's code stays here, never in client/sunset.
# The rows below are the 1.x companion's (horizon-mixin.toml at 9f42064) moved onto the 2e7d2c6 fork: modules all in the
# game crate (support modules may not go below it now), hooks on the game's functions of this build.
id = "sunset_baritone"
name = "Sunset Baritone"
version = "1.1.52"
description = "horizon-baritone (LGPL-3.0) for Sunset's Baritone module: #goto, #mine and the rest of Baritone's commands."
authors = ["luhnox (horizon-baritone)", "leijurv and contributors (Baritone)", "PointOfPressure"]
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "9defaa04337e68d6f368842491834af7bc5727f9"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

