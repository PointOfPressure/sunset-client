# verify.py's test probe as an .hmod package, built next to Sunset on the test machine only (never packed or shipped):
# once a frame, just before the frame is drawn, it appends what the frame is drawn from to the file named by
# SUNSET_PROBE; and each move packet, hit and end of a client tick as it goes on the wire (horizon_protocol's
# observe_sent, Sunset's fork patch 0004). With SUNSET_ANTIBOT_FIXTURE set it also plays verify.py's Anti Bot fixture
# (src/game/antibot.rs): players only this client sees, for the Anti Bot tests.
id = "probe"
name = "Sunset test probe"
version = "0.1.0"
description = "verify.py's test probe (test machine only)."
authors = ["PointOfPressure"]
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "9defaa04337e68d6f368842491834af7bc5727f9"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "probe"
file = "crates/horizon-client/src/game.rs"
name = "sunset_probe"
source = "src/game/probe.rs"

[[native.module]]
id = "probe_wire"
file = "crates/horizon-client/src/game.rs"
name = "sunset_probe_wire"
source = "src/game/wire.rs"

[[native.mixin]]
id = "frame"
target = "horizon_client::game::pad::Game<'_>::pad_look"
kind = "HEAD"
helper = "src/mixins/frame.rs"
bindings = [{ name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }]

[[native.module]]
id = "probe_antibot"
file = "crates/horizon-client/src/game.rs"
name = "sunset_probe_antibot"
source = "src/game/antibot.rs"

[[native.mixin]]
id = "antibot_tick"
target = "horizon_client::game::remote::Game<'_>::remote_handle_input"
kind = "HEAD"
helper = "src/mixins/antibot_tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "antibot_turn"
target = "horizon_client::game::remote::Game<'_>::remote_send_state"
kind = "HEAD"
helper = "src/mixins/antibot_turn.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.mixin]]
id = "antibot_after_tick"
target = "horizon_client::game::native_hooks::client_tick_post::Game<'_>::native_client_tick_post"
kind = "RETURN"
helper = "src/mixins/antibot_after_tick.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
