[mod]
id = "solstice"
version = "0.7.0"
priority = 100

# It hooks the game's own functions as well as the native hook points, so it
# builds on this exact Horizon commit (the Nightly it was made for).
[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "solstice"
source = "runtime.rs"

[[module]]
id = "util"
file = "crates/horizon-client/src/game.rs"
name = "solstice_util"
source = "util.rs"

[[module]]
id = "combat"
file = "crates/horizon-client/src/game.rs"
name = "solstice_combat"
source = "combat.rs"

[[module]]
id = "player"
file = "crates/horizon-client/src/game.rs"
name = "solstice_player"
source = "player.rs"

[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "solstice_world"
source = "world.rs"

[[module]]
id = "fishing_hook"
file = "crates/horizon-client/src/game/fishing.rs"
name = "solstice_fishing"
source = "fishing_hook.rs"

[[module]]
id = "render"
file = "crates/horizon-client/src/game.rs"
name = "solstice_render"
source = "render.rs"

[[module]]
id = "xray_flags"
file = "crates/horizon-client-render/src/mesher.rs"
name = "solstice_xray"
source = "xray_flags.rs"
visibility = "pub"

[[module]]
id = "timer_flags"
file = "crates/horizon-client/src/clock.rs"
name = "solstice_timer"
source = "timer_flags.rs"
visibility = "pub"

[[module]]
id = "input_flags"
file = "crates/horizon-client-input/src/input.rs"
name = "solstice_flags"
source = "input_flags.rs"
visibility = "pub"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

