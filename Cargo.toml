# Sunset workspace: launcher/ (the Sunset launcher), client/ (Sunset itself, built into Horizon by
# horizon-mixins, not by cargo) and plugins/ (the plugin API's test plugin and checks).
#
# client/sunset is the .hmod package (built by the launcher against the Horizon SDK, see client/docs/hmod-port.md).
# client/baritone-engine stays a standalone package: it ships as baritone-engine-<version>-source.zip with its
# own Cargo.lock and is built with --locked, so the launcher's dependencies must not enter its lockfile.
[workspace]
resolver = "3"
members = ["launcher"]
exclude = ["client/baritone-engine", "client/sunset"]

[workspace.package]
edition = "2024"
publish = false
license-file = "LICENSE"

# The launcher is the only member: size over speed (its work is network and disk bound).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Windows builds made on Linux: gpui's renderer compiles its HLSL shaders with fxc.exe at build time only on a Windows
# host, and otherwise (with debug assertions) at run time through d3dcompiler_47.dll, which Windows 10+ has.
[profile.release-cross]
inherits = "release"

[profile.release-cross.package.gpui-fast-windows]
debug-assertions = true
