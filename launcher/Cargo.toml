[package]
name = "sunset-launcher"
version = "2.0.1"
edition.workspace = true
publish.workspace = true
license-file.workspace = true
description = "Sunset launcher: installs the signed prebuilt Sunset client for its pinned Horizon Nightly and plays it through the stock horizon-launcher CLI"

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.15" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.15", features = ["x11", "wayland"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
minisign-verify = "0.3"
sha2 = "0.10"
ruzstd = "0.9"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
png = "0.18"
# The frames of the pictures art.rs rasterises (the version gpui already builds; no codecs).
image = { version = "0.25", default-features = false }
# The round line caps and joins of the icons' strokes (gpui draws paths with lyon and re-exports its StrokeOptions).
lyon_tessellation = "1"
# Plugins: their horizon-mod.toml, and .hmod packages (zip archives); zip also unpacks the Windows horizon-launcher.
toml = "1.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"
ruzstd = "0.9"
